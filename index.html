<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intake: Water Tracker</title>
<meta name="description" content="A small, friendly daily water intake log, 1–6 litres.">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F9F9FF">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Intake">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    color-scheme: light;
    --bg:#F9F9FF;
    --card:#FFFFFF;
    --ink:#241F42;
    --ink-soft:#8A86B8;
    --line:#ECEBFF;
    --water-a:#4FE0FF;
    --water-b:#3B7BFF;
    --sun:#FFDE59;
    --coral:#FF4FA3;
    --grape:#8C6FFF;
    --mint:#2FE0A6;
    --pink:#FF7EB6;
    --shadow:rgba(36,31,66,0.10);
    --shadow-soft:rgba(36,31,66,0.06);
    --tint-pink:#FFE1F1;
    --tint-sun:#FFF3AD;
    --font: 'Fredoka', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition:background .3s ease, color .3s ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .wrap{
    max-width:440px;
    margin:0 auto;
    padding:22px 18px 48px;
    position:relative;
  }

  /* ---- header ---- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand svg{ width:30px; height:30px; flex:none; }
  .brand-text h1{
    font-size:21px; font-weight:700; margin:0; letter-spacing:-0.01em;
  }
  .brand-text p{ margin:0; font-size:12px; color:var(--ink-soft); font-weight:500; }
  .gear{
    background:var(--card);
    border:none;
    color:var(--ink-soft);
    width:42px; height:42px;
    border-radius:14px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 14px rgba(36,31,66,0.10);
    transition:transform .15s ease;
  }
  .gear:active{ transform:scale(0.92); }
  .gear svg{ width:19px; height:19px; }
  button:focus-visible, input:focus-visible{ outline:3px solid var(--grape); outline-offset:2px; }

  /* ---- settings panel ---- */
  .panel{
    background:var(--card);
    border-radius:22px;
    padding:18px;
    margin-bottom:18px;
    display:none;
    box-shadow:0 8px 20px rgba(36,31,66,0.10);
  }
  .panel.open{ display:block; }
  .panel h2{ font-size:13px; font-weight:600; color:var(--ink-soft); margin:0 0 10px; }
  .field{ margin-bottom:16px; }
  .field label{ display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin-bottom:8px; }
  .field label b{ color:var(--water-b); font-weight:700; }
  .field input[type=range]{ width:100%; accent-color:var(--coral); height:22px; }
  .preset-edit{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .preset-edit input{
    background:var(--bg); border:2px solid var(--line); color:var(--ink);
    border-radius:14px; padding:9px; font-family:var(--font); font-weight:600;
    font-size:14px; text-align:center; width:100%;
  }
  .danger-btn{
    width:100%; background:#FFE1F1; border:none; color:var(--coral);
    border-radius:14px; padding:12px; font-family:var(--font); font-weight:600;
    font-size:14px; cursor:pointer; margin-top:6px;
  }
  .danger-btn:active{ transform:scale(0.98); }

  /* ---- bottle ---- */
  .gauge-row{
    display:flex; gap:20px; align-items:center; justify-content:center;
    margin:10px 0 22px;
  }
  .bottle-wrap{ position:relative; flex:none; width:132px; }
  .cap{
    width:46px; height:16px;
    background:var(--sun);
    border-radius:8px 8px 4px 4px;
    margin:0 auto -2px;
  }
  .neck{
    width:56px; height:14px;
    background:var(--card);
    border:3px solid var(--line);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    margin:0 auto -1px;
  }
  .bottle-body{
    position:relative;
    width:132px; height:210px;
    background:var(--card);
    border:3px solid var(--line);
    border-radius:38px 38px 48px 48px;
    overflow:hidden;
    animation:bob 4.5s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }
  .tick{
    position:absolute; right:8px; width:10px; height:3px;
    background:var(--line); border-radius:2px;
  }
  .tick-label{
    position:absolute; right:22px; transform:translateY(-50%);
    font-size:10px; font-weight:600; color:var(--ink-soft);
  }
  .fill-level{
    position:absolute; left:0; right:0; bottom:0; height:0%;
    background:linear-gradient(180deg, var(--water-a), var(--water-b));
    transition:height 0.8s cubic-bezier(.34,1.2,.64,1);
  }
  .fill-level::before{
    content:"";
    position:absolute; left:50%; top:-16px;
    width:220%; height:34px;
    background:inherit;
    border-radius:44%;
    transform:translateX(-50%);
    animation:waveSpin 6s linear infinite;
    opacity:0.85;
  }
  @keyframes waveSpin{
    from{ transform:translateX(-50%) rotate(0deg); }
    to{ transform:translateX(-50%) rotate(360deg); }
  }
  .bubble{
    position:absolute; bottom:6%;
    width:6px; height:6px;
    background:rgba(255,255,255,0.55);
    border-radius:50%;
    animation:rise 3.4s ease-in infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) scale(0.6); opacity:0; }
    15%{ opacity:0.8; }
    100%{ transform:translateY(-150px) scale(1); opacity:0; }
  }
  .goal-flag{
    position:absolute; left:-4px;
    display:flex; align-items:center; gap:3px;
    transform:translateY(-50%);
  }
  .goal-flag .pole{ width:2px; height:14px; background:var(--sun); }
  .goal-flag .pennant{
    width:0; height:0;
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
    border-left:9px solid var(--sun);
  }
  .face{
    position:absolute; left:50%; top:44%;
    transform:translate(-50%,-50%);
    width:70px; height:70px;
    z-index:3;
  }
  .face #eyeL, .face #eyeR{ fill:var(--ink); }
  .face #mouth{ stroke:var(--ink); }
  .blush{ opacity:0; transition:opacity .3s ease; }
  .blush.on{ opacity:1; }

  .readout{ min-width:0; }
  .readout .big{ font-size:38px; line-height:1; font-weight:700; letter-spacing:-0.01em; }
  .readout .big small{ font-size:16px; color:var(--ink-soft); font-weight:600; }
  .readout .pct{ margin-top:8px; font-size:14px; color:var(--ink-soft); font-weight:500; }
  .readout .pct strong{ color:var(--mint); font-weight:700; }
  .readout .over{
    margin-top:10px; font-size:12px; font-weight:700; color:#241F42;
    background:#FFF3AD; display:inline-block; padding:5px 10px; border-radius:10px;
  }

  /* ---- quick add ---- */
  .section-label{
    font-size:13px; font-weight:600; color:var(--ink-soft); margin:22px 0 10px;
  }
  .presets{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .preset-btn{
    border:none; color:#fff; border-radius:20px; padding:14px 6px;
    font-family:var(--font); font-weight:700; font-size:16px; text-align:center;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 8px 0 rgba(0,0,0,0.12);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .preset-btn svg{ width:20px; height:20px; }
  .preset-btn:active{ transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,0.12); }
  .preset-btn span{ font-family:var(--font); font-size:11px; font-weight:600; opacity:0.9; }
  .preset-btn.c0{ background:var(--water-b); }
  .preset-btn.c1{ background:var(--grape); }
  .preset-btn.c2{ background:var(--coral); }

  .custom-row{ display:flex; gap:8px; margin-top:10px; }
  .custom-row input{
    flex:1; background:var(--card); border:2px solid var(--line); color:var(--ink);
    border-radius:16px; padding:12px 16px; font-family:var(--font); font-weight:600;
    font-size:15px; min-width:0;
  }
  .custom-row button{
    background:var(--mint); color:#fff; border:none; border-radius:16px;
    padding:0 22px; font-family:var(--font); font-weight:700; font-size:14px; cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,0.1);
  }
  .custom-row button:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.1); }

  /* ---- log ---- */
  .log-header{ display:flex; justify-content:space-between; align-items:center; margin:24px 0 10px; }
  .log-header .section-label{ margin:0; }
  .text-btn{
    background:none; border:none; color:var(--grape); font-size:13px; font-weight:600;
    cursor:pointer; padding:4px 0;
  }
  .log-list{ display:flex; flex-direction:column; gap:8px; }
  .log-item{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border-radius:16px; padding:10px 12px;
    box-shadow:0 4px 10px rgba(36,31,66,0.06);
  }
  .log-item .dot{ width:9px; height:9px; border-radius:50%; background:var(--water-b); flex:none; }
  .log-item .time{ font-size:12px; color:var(--ink-soft); font-weight:600; width:52px; }
  .log-item .amt{ flex:1; font-weight:600; font-size:14px; }
  .log-item button{
    background:#FFE1F1; border:none; color:var(--coral); width:26px; height:26px;
    border-radius:50%; font-size:14px; font-weight:700; cursor:pointer; line-height:1;
  }
  .empty{
    padding:20px 2px; color:var(--ink-soft); font-size:13px; text-align:center;
    background:var(--card); border-radius:16px; font-weight:500;
  }

  /* ---- history ---- */
  .history{ display:flex; align-items:flex-end; gap:8px; height:76px; margin-top:10px; }
  .history .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .history .bar{
    width:100%; max-width:28px; background:var(--bg); border:2px solid var(--ink-soft); border-radius:10px 10px 6px 6px;
    position:relative; overflow:hidden; height:100%;
  }
  .history .bar i{
    position:absolute; left:0; right:0; bottom:0; display:block;
    background:linear-gradient(180deg, var(--water-a), var(--water-b));
    border-radius:10px 10px 6px 6px;
  }
  .history .day-lbl{ font-size:10px; color:var(--ink-soft); font-weight:600; margin-top:5px; }
  .history .bar-col.today .day-lbl{ color:var(--coral); }

  .status{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:26px; font-weight:600; min-height:14px; }
  .credit{
    display:block; text-align:center; margin-top:14px;
    font-size:12px; font-weight:600; color:var(--grape);
    text-decoration:none;
  }
  .credit:active{ opacity:0.7; }

  /* ---- confetti ---- */
  .confetti-layer{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50;
  }
  .confetti-piece{
    position:absolute; top:-12px; width:8px; height:12px; border-radius:2px;
    animation-name:fall; animation-timing-function:ease-in; animation-fill-mode:forwards;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(420px) rotate(540deg); opacity:0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 5 11 5 15.5C5 19.6 8.1 22 12 22C15.9 22 19 19.6 19 15.5C19 11 12 2 12 2Z" fill="#3B7BFF"/></svg>
      <div class="brand-text">
        <h1>Intake</h1>
        <p id="dateLabel">—</p>
      </div>
    </div>
    <button class="gear" id="gearBtn" aria-expanded="false" aria-controls="panel" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="15" cy="7" r="2.4" fill="currentColor" stroke="none"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="17" r="2.4" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>

  <section class="panel" id="panel">
    <h2>Daily goal</h2>
    <div class="field">
      <label for="goalRange">Target <b id="goalVal">2.5 L</b></label>
      <input type="range" id="goalRange" min="1" max="6" step="0.25" value="2.5">
    </div>
    <h2>Quick-add amounts (ml)</h2>
    <div class="preset-edit">
      <input type="number" id="p0" min="10" max="2000" step="10">
      <input type="number" id="p1" min="10" max="2000" step="10">
      <input type="number" id="p2" min="10" max="2000" step="10">
    </div>
    <button class="danger-btn" id="resetBtn" style="margin-top:16px;">Reset today's log</button>
  </section>

  <div class="gauge-row">
    <div class="bottle-wrap" id="bottleWrap">
      <div class="cap"></div>
      <div class="neck"></div>
      <div class="bottle-body" id="bottleBody">
        <div class="fill-level" id="fill">
          <span class="bubble" style="left:22%; animation-delay:0s;"></span>
          <span class="bubble" style="left:52%; animation-delay:1.1s;"></span>
          <span class="bubble" style="left:74%; animation-delay:2.1s;"></span>
        </div>
        <svg class="face" id="face" viewBox="0 0 70 70">
          <ellipse class="blush" id="blushL" cx="16" cy="34" rx="6" ry="4" fill="#FFAEDB"/>
          <ellipse class="blush" id="blushR" cx="54" cy="34" rx="6" ry="4" fill="#FFAEDB"/>
          <circle id="eyeL" cx="24" cy="28" r="3.6" fill="#241F42"/>
          <circle id="eyeR" cx="46" cy="28" r="3.6" fill="#241F42"/>
          <path id="mouth" d="M23 40 Q35 46 47 40" stroke="#241F42" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div class="readout">
      <div class="big" id="totalReadout" aria-live="polite">···</div>
      <div class="pct" id="pctReadout"></div>
      <div class="over" id="overReadout" hidden></div>
    </div>
  </div>

  <div class="section-label">Log intake</div>
  <div class="presets" id="presetBtns"></div>
  <div class="custom-row">
    <input type="number" id="customMl" placeholder="Custom, ml" min="1" max="5000" inputmode="numeric">
    <button id="customAdd">Add</button>
  </div>

  <div class="log-header">
    <div class="section-label">Today's log</div>
    <button class="text-btn" id="undoBtn">Undo last</button>
  </div>
  <div class="log-list" id="logList"></div>

  <div class="section-label">Last 7 days</div>
  <div class="history" id="history"></div>

  <div class="status" id="statusLine">Loading…</div>
  <a class="credit" href="contact.html">Made by DevRenike</a>
</div>

<script>
(function(){
  "use strict";

  var SCALE_MAX_L = 6;
  var STORAGE_KEY = 'intake-data';
  var CUP_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 3h14l-1.4 15.2A3 3 0 0 1 14.6 21H9.4a3 3 0 0 1-3-2.8L5 3Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="M6.3 9.5h11.4" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var CONFETTI_COLORS = ['#FF4FA3','#FFDE59','#8C6FFF','#2FE0A6','#3B7BFF','#4FE0FF'];

  var els = {
    dateLabel: document.getElementById('dateLabel'),
    gearBtn: document.getElementById('gearBtn'),
    panel: document.getElementById('panel'),
    goalRange: document.getElementById('goalRange'),
    goalVal: document.getElementById('goalVal'),
    p0: document.getElementById('p0'),
    p1: document.getElementById('p1'),
    p2: document.getElementById('p2'),
    resetBtn: document.getElementById('resetBtn'),
    fill: document.getElementById('fill'),
    bottleWrap: document.getElementById('bottleWrap'),
    totalReadout: document.getElementById('totalReadout'),
    pctReadout: document.getElementById('pctReadout'),
    overReadout: document.getElementById('overReadout'),
    presetBtns: document.getElementById('presetBtns'),
    customMl: document.getElementById('customMl'),
    customAdd: document.getElementById('customAdd'),
    undoBtn: document.getElementById('undoBtn'),
    logList: document.getElementById('logList'),
    history: document.getElementById('history'),
    statusLine: document.getElementById('statusLine'),
    eyeL: document.getElementById('eyeL'),
    eyeR: document.getElementById('eyeR'),
    mouth: document.getElementById('mouth'),
    blushL: document.getElementById('blushL'),
    blushR: document.getElementById('blushR')
  };

  var MOUTHS = {
    neutral: 'M23 40 Q35 46 47 40',
    happy:   'M21 38 Q35 52 49 38',
    party:   'M21 36 Q35 54 49 36'
  };

  function todayKey(d){
    d = d || new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }

  function defaultData(){
    return { goalL: 2.5, presets: [200, 500, 750], history: {}, logs: {} };
  }

  var data = defaultData();
  var dateKey = todayKey();
  var saveTimer = null;
  var celebratedFor = null;

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        data = Object.assign(defaultData(), parsed);
        if(!data.history) data.history = {};
        if(!data.logs) data.logs = {};
      }
    }catch(e){ /* first run, or storage unavailable — keep defaults */ }
  }

  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        els.statusLine.textContent = 'Saved on this device';
      }catch(e){
        els.statusLine.textContent = 'Could not save on this device';
      }
    }, 250);
  }

  function loadLog(key){ return data.logs[key] || []; }
  function saveLog(key, arr){ data.logs[key] = arr; }

  function syncHistoryForToday(){
    var arr = loadLog(dateKey);
    var total = arr.reduce(function(s,e){ return s + e.ml; }, 0);
    data.history[dateKey] = total;
    return total;
  }

  function formatTime(iso){
    var d = new Date(iso);
    var h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
    var ampm = h >= 12 ? 'pm' : 'am';
    var h12 = h % 12; if(h12===0) h12 = 12;
    return h12 + ':' + m + ampm;
  }

  function buildTicks(){
    var frame = els.bottleWrap.querySelector('.bottle-body');
    Array.prototype.slice.call(frame.querySelectorAll('.tick,.tick-label,.goal-flag')).forEach(function(n){ n.remove(); });
    for(var l=0; l<=SCALE_MAX_L; l++){
      var pct = (l / SCALE_MAX_L) * 100;
      var tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.bottom = pct + '%';
      frame.appendChild(tick);
      if(l > 0 && l < SCALE_MAX_L){
        var lbl = document.createElement('div');
        lbl.className = 'tick-label';
        lbl.style.bottom = pct + '%';
        lbl.textContent = l;
        frame.appendChild(lbl);
      }
    }
  }

  function updateGoalFlag(){
    var frame = els.bottleWrap.querySelector('.bottle-body');
    var old = frame.querySelector('.goal-flag');
    if(old) old.remove();
    var flag = document.createElement('div');
    flag.className = 'goal-flag';
    flag.style.bottom = ((data.goalL / SCALE_MAX_L) * 100) + '%';
    flag.innerHTML = '<span class="pole"></span><span class="pennant"></span>';
    frame.appendChild(flag);
  }

  function setMood(pct){
    var mood = pct >= 100 ? 'party' : (pct >= 40 ? 'happy' : 'neutral');
    els.mouth.setAttribute('d', MOUTHS[mood]);
    els.blushL.classList.toggle('on', mood !== 'neutral');
    els.blushR.classList.toggle('on', mood !== 'neutral');
    var eyeR = mood === 'party' ? 4.4 : 3.6;
    els.eyeL.setAttribute('r', eyeR);
    els.eyeR.setAttribute('r', eyeR);
    return mood;
  }

  function fireConfetti(){
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    for(var i=0; i<22; i++){
      var p = document.createElement('div');
      p.className = 'confetti-piece';
      var left = Math.random()*100;
      var color = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
      var dur = 1.1 + Math.random()*0.8;
      var delay = Math.random()*0.4;
      p.style.left = left + 'vw';
      p.style.background = color;
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = delay + 's';
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 2200);
  }

  function render(){
    els.dateLabel.textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });

    var totalMl = syncHistoryForToday();
    var totalL = totalMl / 1000;
    var goalL = data.goalL;
    var pct = Math.min(999, (totalL / goalL) * 100);
    var scalePct = Math.min(100, (totalL / SCALE_MAX_L) * 100);

    els.fill.style.height = scalePct + '%';
    updateGoalFlag();

    els.totalReadout.innerHTML = totalL.toFixed(2) + '<small> / ' + goalL.toFixed(2) + ' L</small>';
    els.pctReadout.innerHTML = '<strong>' + Math.round(Math.min(100,pct)) + '%</strong> of today\u2019s goal';

    if(totalL > SCALE_MAX_L){
      els.overReadout.hidden = false;
      els.overReadout.textContent = 'Over the ' + SCALE_MAX_L + 'L scale. Nicely done!';
    } else {
      els.overReadout.hidden = true;
    }

    var mood = setMood(pct);
    if(mood === 'party' && celebratedFor !== dateKey){
      celebratedFor = dateKey;
      fireConfetti();
    }
    if(pct < 100 && celebratedFor === dateKey){
      celebratedFor = null;
    }

    var arr = loadLog(dateKey).slice().sort(function(a,b){ return b.t.localeCompare(a.t); });
    els.logList.innerHTML = '';
    if(arr.length === 0){
      els.logList.innerHTML = '<div class="empty">Nothing logged yet today.</div>';
    } else {
      arr.forEach(function(entry){
        var row = document.createElement('div');
        row.className = 'log-item';
        row.innerHTML = '<span class="dot"></span><span class="time">' + formatTime(entry.t) + '</span>' +
          '<span class="amt">' + entry.ml + ' ml</span>' +
          '<button aria-label="Delete entry" data-id="' + entry.id + '">\u00d7</button>';
        els.logList.appendChild(row);
      });
    }

    renderHistory();
  }

  function renderHistory(){
    els.history.innerHTML = '';
    var maxMl = SCALE_MAX_L * 1000;
    var todayK = todayKey();
    for(var i=6; i>=0; i--){
      var d = new Date();
      d.setDate(d.getDate() - i);
      var key = todayKey(d);
      var ml = data.history[key] || 0;
      var pct = Math.min(100, (ml / maxMl) * 100);
      var col = document.createElement('div');
      col.className = 'bar-col' + (key === todayK ? ' today' : '');
      col.innerHTML = '<div class="bar"><i style="height:' + pct + '%"></i></div>' +
        '<div class="day-lbl">' + d.toLocaleDateString(undefined,{weekday:'narrow'}) + '</div>';
      els.history.appendChild(col);
    }
  }

  function addEntry(ml){
    ml = Math.round(ml);
    if(!ml || ml <= 0) return;
    var arr = loadLog(dateKey);
    arr.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2,7), ml: ml, t: new Date().toISOString() });
    saveLog(dateKey, arr);
    render();
    persist();
  }

  function deleteEntry(id){
    var arr = loadLog(dateKey).filter(function(e){ return e.id !== id; });
    saveLog(dateKey, arr);
    render();
    persist();
  }

  function undoLast(){
    var arr = loadLog(dateKey);
    if(arr.length === 0) return;
    arr.sort(function(a,b){ return a.t.localeCompare(b.t); });
    arr.pop();
    saveLog(dateKey, arr);
    render();
    persist();
  }

  function renderPresetButtons(){
    els.presetBtns.innerHTML = '';
    var classes = ['c0','c1','c2'];
    data.presets.forEach(function(ml, idx){
      var btn = document.createElement('button');
      btn.className = 'preset-btn ' + classes[idx % 3];
      btn.innerHTML = CUP_ICON + '+' + ml + '<span>ml</span>';
      btn.addEventListener('click', function(){ addEntry(ml); });
      els.presetBtns.appendChild(btn);
    });
  }

  function applyGoalToUI(){
    els.goalRange.value = data.goalL;
    els.goalVal.textContent = data.goalL.toFixed(2) + ' L';
  }

  els.gearBtn.addEventListener('click', function(){
    var open = els.panel.classList.toggle('open');
    els.gearBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  els.goalRange.addEventListener('input', function(){
    data.goalL = parseFloat(els.goalRange.value);
    els.goalVal.textContent = data.goalL.toFixed(2) + ' L';
    render();
    persist();
  });

  [els.p0, els.p1, els.p2].forEach(function(input, idx){
    input.addEventListener('change', function(){
      var v = parseInt(input.value, 10);
      if(v && v > 0){
        data.presets[idx] = v;
        renderPresetButtons();
        persist();
      }
    });
  });

  els.resetBtn.addEventListener('click', function(){
    if(confirm('Clear all of today\u2019s logged entries?')){
      saveLog(dateKey, []);
      render();
      persist();
    }
  });

  els.customAdd.addEventListener('click', function(){
    var v = parseInt(els.customMl.value, 10);
    addEntry(v);
    els.customMl.value = '';
  });
  els.customMl.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ els.customAdd.click(); }
  });

  els.undoBtn.addEventListener('click', undoLast);

  els.logList.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-id]');
    if(btn) deleteEntry(btn.getAttribute('data-id'));
  });

  setInterval(function(){
    var k = todayKey();
    if(k !== dateKey){
      dateKey = k;
      celebratedFor = null;
      render();
    }
  }, 30000);

  // ---- init ----
  buildTicks();
  loadData();
  applyGoalToUI();
  els.p0.value = data.presets[0];
  els.p1.value = data.presets[1];
  els.p2.value = data.presets[2];
  renderPresetButtons();
  render();
  els.statusLine.textContent = 'Saved on this device';

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
